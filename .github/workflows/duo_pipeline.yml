name: Cisco Duo Log Pipeline

on:
  workflow_dispatch:  # <--- THIS LINE ENABLES THE "RUN WORKFLOW" BUTTON
  schedule:
    - cron: '0 * * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duo_client

      - name: Execute Duo Log Script
        env:
          DUO_HOST: ${{ secrets.DUO_HOST }}
          DUO_IKEY: ${{ secrets.DUO_IKEY }}
          DUO_SKEY: ${{ secrets.DUO_SKEY }}
          DUO_AUTH_IKEY: ${{ secrets.DUO_AUTH_IKEY }}
          DUO_AUTH_SKEY: ${{ secrets.DUO_AUTH_SKEY }}
        run: |
          python combined_logs.py
