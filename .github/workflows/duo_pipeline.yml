name: Cisco Duo Automation Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-duo-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # FIX: Install required Duo Python SDK dependency
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duo-client

      - name: Execute Duo Automation Pipeline
        env:
          DUO_IKEY: ${{ secrets.DUO_IKEY }}
          DUO_SKEY: ${{ secrets.DUO_SKEY }}
          DUO_API_HOST: ${{ secrets.DUO_API_HOST }}
        run: |
          python duo_automation_pipeline.py
